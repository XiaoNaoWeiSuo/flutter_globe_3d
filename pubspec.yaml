name: flutter_globe_3d
description: "High-performance interactive 3D sphere rendering for Flutter, with shader materials, camera poses, annotations and connections."
version: 3.0.1
homepage: https://github.com/XiaoNaoWeiSuo/flutter_globe_3d
repository: https://github.com/XiaoNaoWeiSuo/flutter_globe_3d

environment:
  sdk: ^3.0.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  assets:
    - assets/images/earth.jpg
    - assets/images/earth_night.jpg
  shaders:
    - assets/shaders/uniform.frag
    - assets/shaders/earth.frag
    - assets/shaders/earth_low.frag
    - assets/shaders/earth_high.frag
    - assets/shaders/earth_ultra.frag
